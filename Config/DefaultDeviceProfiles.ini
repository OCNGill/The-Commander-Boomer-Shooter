; The Commander - per-node performance profiles
; ---------------------------------------------------------------------------
; This file implements the per-node gate described in
; Docs/generated/PERFORMANCE_UPSCALER_PROFILE.md.
;
; The rule: a capability is never written to a node that cannot execute it.
; Each fleet node selects its own profile on the command line:
;
;   UnrealEditor-Cmd.exe TheCommander.uproject -DeviceProfile=<Name>
;   (the engine also accepts the short form -DP=<Name>; see
;   UDeviceProfileManager::GetPlatformDeviceProfileName)
;
; Selected with the project's own launcher in the field.
;
; WHY DEVICE PROFILES AND NOT ONE SHARED INI
;   The engine's console-variable priority ladder (IConsoleManager.h) is:
;       Constructor < Scalability < GameSetting < ProjectSetting
;         < SystemSettingsIni < PluginLowPriority < DeviceProfile
;         < PluginHighPriority < GameOverride < ConsoleVariablesIni
;         < Hotfix < Preview < Commandline < Code < Temp < Console
;   A device profile (0x07) therefore BEATS:
;     - the project-wide [ConsoleVariables] block in DefaultEngine.ini (0x05)
;     - the project settings in [/Script/Engine.RendererSettings] (0x04)
;     - every scalability group (0x02)
;   That is what makes the per-node gate authoritative. It is also the reason
;   the fleet-wide defaults in DefaultEngine.ini are a floor, not a cap.
;
;   REVERSE TRAP - this project hit it once: a value set in
;   [/Script/Engine.RendererSettings] (project setting, 0x04) BEATS a
;   scalability group (0x02). A scalability group that sets a variable the
;   project also sets in RendererSettings NEVER takes effect. That is why
;   r.Shadow.MaxCSMResolution is set here rather than only in a group.
;
;   Device profile CVars are set through
;   UE::ConfigUtilities::OnSetCVarFromIniEntry(..., ECVF_SetByDeviceProfile),
;   which has no ECVF_Scalability restriction - so they can set the FSR
;   cvars, which are ECVF_RenderThreadSafe only and are REJECTED if
;   placed in a scalability group.
;
; UPGRADE NOTE: UE only loads known ini files (Engine, Game, Input,
; DeviceProfiles, GameUserSettings, Scalability, RuntimeOptions,
; InstallBundle, Hardware, GameplayTags). A file named
; "DefaultUpscalerProfile.ini" would be silently ignored - hence this file.
; ---------------------------------------------------------------------------

; ---------------------------------------------------------------------------
; Steam Deck (AMD RDNA 2 "Van Gogh" APU) - the target device.
; ---------------------------------------------------------------------------
[CommanderDeckRDNA2 DeviceProfile]
DeviceType=Desktop
BaseProfileName=Windows
+CVars=r.FidelityFX.FSR.Enabled=1
; FSR 3.x ONLY, and FORCED rather than left to the loader.
;
; FSR 4.1 is an RDNA 3 feature and cannot run on RDNA 2. AMD's own stated
; requirement for FSR 4.1.1 (gpuopen.com/amd-fsr-upscaling, "Requirements"):
;
;   "AMD FSR(TM) Upscaling 4.1.1 : AMD Radeon(TM) RX 9000 and 7000 Series
;    discrete GPUs. Requires Shader Model 6.6 support."
;
; That is AMD's vendor documentation, not a measurement by this project. No
; shader-model gate was found in the vendored fidelityfx-sdk headers or in
; the FFX upscaler source - the provider is actually chosen by the FFX
; runtime's own device check inside the signed
; amd_fidelityfx_upscaler_dx12.dll. The operative, verifiable reason this
; profile pins 3 is the plugin's own guard, below.
;
; The plugin's own override guard is
;   `RequestedFSRProvider > 0 && RequestedFSRProvider < 4`
; and the provider is matched by the MAJOR DIGIT of the FFX version string
; (FfxTryOverrideContextVersion: versionMajor == VersionNumber), so 3
; selects "3.1.5". Note 4 is NOT a legal value - the guard excludes it - so
; FSR 4.1.1 can never be forced from config at all; it is reachable only by
; letting the FidelityFX loader pick it on hardware that supports it.
;
; Why force 3 instead of leaving 0 (loader picks the best tier)? Because
; "the best tier" is a moving target as AMD ships new providers, and the
; Deck's ceiling is fixed by its silicon. Forcing 3 makes the Deck's tier a
; stated fact rather than an emergent property, and it is asserted by
; Tools/ue/verify_upscaler_run.py.
+CVars=r.FidelityFX.FSR.RequestProvider=3
; Performance = 2.0x upscale = 50% render resolution. The plugin writes
; r.ScreenPercentage itself from this mode (UpdateScreenPercentage()).
+CVars=r.FidelityFX.FSR.QualityMode=3
; A third-party temporal upscaler needs a temporal-accumulation AA method;
; with AAM_TSR (4, the engine default) the renderer's own TSR holds the
; temporal upscaler slot and the FSR plugin never engages.
+CVars=r.AntiAliasingMethod=2
+CVars=r.TemporalAA.Upscaler=1
; BLOOM OFF on the Deck. The emissive reveal is a LOCAL effect: a Post
; Process Volume in the level turns bloom on over the reveal area only.
; This must outrank any scalability group, so it lives here rather than in
; DefaultScalability.ini.
+CVars=r.BloomQuality=0
; SHADOW RESOLUTION for the Deck. The project's RendererSettings sets
; r.Shadow.MaxCSMResolution=2048 as a project setting (priority 0x04), which
; BEATS every scalability group (0x02) - so the engine's own
; [ShadowQuality@0] (512) could never apply and the Deck would have kept
; 2048. Setting it here at device-profile priority (0x07) puts the Deck's
; low value back in charge.
+CVars=r.Shadow.MaxCSMResolution=512

; ---------------------------------------------------------------------------
; AMD RDNA 3 desktop (RX 7900 XTX / RX 7600) - FSR 4.1 eligible.
; ---------------------------------------------------------------------------
[CommanderRDNA3Desktop DeviceProfile]
DeviceType=Desktop
BaseProfileName=Windows
+CVars=r.FidelityFX.FSR.Enabled=1
; RequestProvider=0: let the FidelityFX loader choose. 4 is not a legal
; forced value (the plugin's guard `RequestedFSRProvider > 0 &&
; RequestedFSRProvider < 4` excludes it), so 0 is the only way to reach
; 4.1.1 - and the right way, since the loader also verifies the hardware
; supports it.
;
; WHAT TIER 0 ACTUALLY YIELDS IS NOT GUARANTEED. On the SM 6.7-class
; verification host, 0 resolved to FSR 3.1.5, not 4.1.1. FSR 4.1.1 has
; never been observed to initialise by this project; it needs an RDNA 3
; device to test. See PERFORMANCE_UPSCALER_PROFILE.md section 9.2.
+CVars=r.FidelityFX.FSR.RequestProvider=0
; Quality = 1.5x upscale = 66.7% render resolution.
+CVars=r.FidelityFX.FSR.QualityMode=1
+CVars=r.AntiAliasingMethod=2
+CVars=r.TemporalAA.Upscaler=1
+CVars=r.BloomQuality=4
+CVars=r.Shadow.MaxCSMResolution=2048

; ---------------------------------------------------------------------------
; Pre-RDNA AMD laptop (Vega / GCN) - FSR 2 or the engine's own TSR.
; ---------------------------------------------------------------------------
[CommanderVegaLaptop DeviceProfile]
DeviceType=Desktop
BaseProfileName=Windows
+CVars=r.FidelityFX.FSR.Enabled=1
; FSR 2.x only. This is the analytical fallback tier, and it is the tier this
; profile targets for a pre-RDNA part. Verified working on the SM 6.7-class
; verification host: provider 2.3.4 initialised, r.ScreenPercentage 66.6667.
+CVars=r.FidelityFX.FSR.RequestProvider=2
; Quality = 1.5x upscale = 66.7% render resolution.
+CVars=r.FidelityFX.FSR.QualityMode=1
+CVars=r.AntiAliasingMethod=2
+CVars=r.TemporalAA.Upscaler=1
+CVars=r.BloomQuality=0
+CVars=r.Shadow.MaxCSMResolution=512
; If FSR cannot initialise on this hardware, the plugin disables itself
; (FFXFSRViewExtension.cpp: "Disable FSR as it could not be initialised")
; and the engine falls back to its own TSR. No further action is required.
