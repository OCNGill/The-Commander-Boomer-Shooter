; The Commander - Game configuration
; Hard rules from the design brief:
;   - NO reload animations, NO stamina, NO cover systems, NO RPG elements.
;   - Every gun overpowered. Instant weapon switching. Screen shake + gibs on kill.

; The boot map and game mode live in DefaultEngine.ini, not here.
; UGameMapsSettings is an Engine-config class: a GameDefaultMap line in
; this Game-category file is silently ignored and the engine falls back to
; /Engine/Maps/Templates/OpenWorld.

[/Script/UnrealEd.ProjectPackagingSettings]

; Cook the global shader library so the shipped build carries a PRECOMPILED
; PSO cache instead of compiling every pipeline on the player's first launch.
; This is what makes a CPU-APU target (Steam Deck, laptop iGPU) viable.
bShareMaterialShaderCode=True

; NOTE: the enum values are PPBC_* (PPBC_Development, PPBC_Debug,
; PPBC_DebugGame, PPBC_Test, PPBC_Shipping). "PPB_Shipping" is not a member
; of EProjectPackagingBuildConfigurations, so it made the config load FAIL
; with:
;   LogObj: Error: LoadConfig (/Script/DeveloperToolSettings.Default__ProjectPackagingSettings):
;   import failed for BuildConfiguration in: PPB_Shipping
; which aborted the cook on both the init pass and the cook pass.
; Shipping is the intended value for a release build; a Development client
; build is selected on the command line with -clientconfig=Development.
BuildConfiguration=PPBC_Development

; Cook the arena even if nothing references it, so the packaged .exe always
; has the level it boots into.
+MapsToCook=(FilePath="/Game/Maps/M_Blockout01")

; The Commander's runtime level-fix subsystem and the player character both use
; the engine primitives (Cube, Cylinder, Capsule). A cook that only follows
; asset references from the map drops them, and the packaged game then logs
; "Failed to find object 'StaticMesh /Engine/BasicShapes/Cube.Cube'" and
; spawns invisible cover blocks and a missing player body. Always cook the
; whole BasicShapes folder so the shipped build cannot lose them.
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")

; Ship Windows-native, sovereign build (no GitHub Actions).
; Full rebuild + local UAT packaging; nothing leaves the fleet.
