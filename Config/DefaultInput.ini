; The Commander - project input configuration.
;
; UInputSettings is a "config=Input" class, so THIS file (Config/DefaultInput.ini)
; is where the project's input stack is defined. It did not exist before, which
; is why the shipped build fell back to the engine's BaseInput.ini: no axis
; mappings, no action mappings, and the default (legacy) UPlayerInput class -
; which is also what produced the runtime warning
;   "UEnhancedInputLocalPlayerSubsystem for LocalPlayer_0 does not have a
;    valid PlayerInput object".
;
; Axis names below MUST match the bindings in
; ACommanderCharacter::SetupPlayerInputComponent (Source/TheCommanderGame),
; and the action names MUST match the action bindings in the same place.
; A mapping whose name nothing binds is a dead binding, so both sides are
; kept in one place and verified in-engine by the input audit
; (-CommanderInputAudit).

[/Script/Engine.InputSettings]

; Use the Enhanced Input player input / input component classes. The Enhanced
; Input local player subsystem looks for a UEnhancedPlayerInput on the local
; player; with the legacy default it never finds one and logs the warning
; above. This is the fix for that warning - it is a config change, not a code
; change, so it survives into the packaged .exe.
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent

; --- Movement axes -------------------------------------------------------
; ACommanderCharacter binds these four names:
;   MoveForward -> AddMovementInput (control rotation yaw, forward)
;   MoveRight   -> AddMovementInput (control rotation yaw, right)
;   Turn        -> AddControllerYawInput
;   LookUp      -> AddControllerPitchInput
+AxisMappings=(AxisName="MoveForward",Key=W,Scale=1.000000)
+AxisMappings=(AxisName="MoveForward",Key=S,Scale=-1.000000)
+AxisMappings=(AxisName="MoveRight",Key=D,Scale=1.000000)
+AxisMappings=(AxisName="MoveRight",Key=A,Scale=-1.000000)
+AxisMappings=(AxisName="Turn",Key=MouseX,Scale=1.000000)
+AxisMappings=(AxisName="LookUp",Key=MouseY,Scale=-1.000000)
+AxisMappings=(AxisName="MoveForward",Key=Gamepad_LeftY,Scale=1.000000)
+AxisMappings=(AxisName="MoveRight",Key=Gamepad_LeftX,Scale=1.000000)
+AxisMappings=(AxisName="Turn",Key=Gamepad_RightX,Scale=1.000000)
+AxisMappings=(AxisName="LookUp",Key=Gamepad_RightY,Scale=-1.000000)

; --- Action mappings -----------------------------------------------------
; ACommanderCharacter binds these three names:
;   Fire -> hitscan trace down the camera forward vector
;   Jump -> ACharacter::Jump
;   Dash -> forward impulse, one second cooldown
+ActionMappings=(ActionName="Fire",Key=LeftMouseButton,bShift=False,bCtrl=False,bAlt=False,bCmd=False)
+ActionMappings=(ActionName="Fire",Key=Gamepad_RightTrigger,bShift=False,bCtrl=False,bAlt=False,bCmd=False)
+ActionMappings=(ActionName="Jump",Key=SpaceBar,bShift=False,bCtrl=False,bAlt=False,bCmd=False)
+ActionMappings=(ActionName="Jump",Key=Gamepad_FaceButton_Bottom,bShift=False,bCtrl=False,bAlt=False,bCmd=False)
+ActionMappings=(ActionName="Dash",Key=LeftShift,bShift=False,bCtrl=False,bAlt=False,bCmd=False)
