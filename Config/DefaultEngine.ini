; The Commander - Engine configuration
; Design targets: 144+ FPS, raw mouse input, no regeneration, classic pickups.

[/Script/EngineSettings.GameMapsSettings]
; UGameMapsSettings is an Engine-config class, so the boot map MUST be set
; here. A GameDefaultMap line in DefaultGame.ini is read by a different
; config category and is silently ignored - the engine then falls back to
; its own BaseEngine.ini default, /Engine/Maps/Templates/OpenWorld, and the
; packaged game boots an empty template instead of the arena.
GameDefaultMap=/Game/Maps/M_Blockout01
GlobalDefaultGameMode=/Script/TheCommanderGame.CommanderGameMode
EditorStartupMap=
GameInstanceClass=/Script/Engine.GameInstance

[/Script/Engine.Engine]
; Raw mouse input - no OS acceleration smoothing.
bUseRawMouseInput=True
; Frame pacing: uncapped in-game; the design target is 144+.
SmoothedFrameRateRange=(LowerBound=(Type=Inclusive,Value=22.000000),UpperBound=(Type=Exclusive,Value=400.000000))

[/Script/Engine.RendererSettings]

; --- Shader / PSO precache -------------------------------------------------
; Without a cooked PSO cache the first run of the shipped .exe compiles every
; shader pipeline at runtime. Measured on the laptop's integrated AMD Radeon
; (CPU iGPU): ~187 s before the map appears. On a Steam Deck APU that is
; minutes PER LAUNCH. With the pipeline cache enabled and the global shader
; library shared at cook time, those PSOs arrive already compiled in the pak.
r.ShaderPipelineCache.Enabled=1
r.ShaderPipelineCache.ReportPSO=1
r.ShaderPipelineCache.BatchSize=50
r.ShaderPipelineCache.BatchTime=1.0

; Performance-first raster pipeline for a retro shooter (no cinematic stack).
r.DefaultFeature.Projector=False
r.DefaultFeature.Bloom=False
r.DefaultFeature.AmbientOcclusion=False
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.Shadow.MaxCSMResolution=2048
r.AllowGlobalClipPlane=False
; Foreground FPS priority in windowed mode.
r.AllowMultipleGamesOfType=False
; Anti-aliasing method 2 = Temporal AA (AAM_TemporalAA).
; This is what lets a third-party temporal upscaler (FSR) take the engine's
; temporal upscaler slot. With AAM_TSR (4, the engine default) the
; renderer's own TSR holds that slot and the FSR plugin never engages.
; The engine confirms the handover in SceneRendering.cpp:3060 - when a
; third-party upscaler claims the slot the engine forces
; View.AntiAliasingMethod = AAM_TemporalAA and
; View.PrimaryScreenPercentageMethod = TemporalUpscale.
; Per-node overrides live in Config/DefaultDeviceProfiles.ini.
DefaultFeatureAntiAliasing=2

[/Script/Engine.InputSettings]
; Raw input for mouse; no smoothing on look.
bEnableMouseSmoothing=False
bViewAccelerationEnabled=False
bAlwaysShowTouchInterface=False
DefaultPlayerInputClass=/Script/Engine.PlayerInput
DefaultInputComponentClass=/Script/Engine.InputComponent

[ConsoleVariables]
; Cap solid pixel performance: stay raster, skip heavy deferred extras.
r.VSync=0

; ---------------------------------------------------------------------------
; Upscaler baseline (fleet-wide). Per-node overrides live in
; Config/DefaultDeviceProfiles.ini and win over this block, because device
; profile CVars are applied at ECVF_SetByDeviceProfile, a stronger priority
; than this section's ECVF_SetBySystemSettingsIni.
;
; r.FidelityFX.FSR.Enabled
;   1 = enable FSR upscaling. The plugin then picks the provider the
;   running GPU actually supports; if none is supported the plugin
;   disables itself and the engine falls back to TSR.
;
; r.FidelityFX.FSR.RequestProvider
;   0 = let the FidelityFX loader choose the best provider this GPU
;       supports (default). Use this on hardware whose newest tier the
;       loader can reach - an RDNA 3 desktop, where the loader may pick
;       FSR 4.1.1. NOTE: on the SM 6.7-class verification host the loader
;       resolved 0 to FSR 3.1.5, so which tier 0 yields is a property of
;       the running GPU, not a guarantee. See
;       Docs/generated/PERFORMANCE_UPSCALER_PROFILE.md section 9.2.
;   1..3 = force a provider by FSR major version. The plugin's own guard
;       is `RequestedFSRProvider > 0 && RequestedFSRProvider < 4`, so
;       3 is the highest legal forced value and selects "3.1.5" (FSR 3).
;       An out-of-range value logs "Could not find a legal FSR Upscaling
;       provider" and falls back to the default provider.
;   The fleet baseline is 0. The Deck does NOT use this block: its device
;   profile forces 3, because FSR 4.1 is an RDNA 3 feature and the Deck
;   is RDNA 2.
;
; r.TemporalAA.Upscaler
;   1 = GTemporalUpscaler, which MAY be overridden by a third party
;       plugin (engine default). 0 would force the renderer's own
;       upscaler and stop FSR from ever being selected.
; ---------------------------------------------------------------------------
r.FidelityFX.FSR.Enabled=1
r.FidelityFX.FSR.RequestProvider=0
r.TemporalAA.Upscaler=1

; ---------------------------------------------------------------------------
; XeSS Frame Generation (XeFG) MUST NOT hijack the D3D12 swap chain.
;
; VERIFIED ON MAIN (Ryzen 9 5900X / RX 7900 XTX, UE 5.8, 2026-10-22):
; with the XeFG swap-chain override ON, the packaged standalone build dies at
; startup in FD3D12Viewport::Init():
;   LogXeFGSDK: Error: Failed to create swap chain: 0x887a0022
;               (0x887a0022 = DXGI_ERROR_NOT_CURRENTLY_AVAILABLE)
;   LogXeFGRHI: Error: Failed to create XeFG swap chain, result: -17
;   LogD3D12RHI: Error: hr failed at WindowsD3D12Viewport.cpp:162
;   Fatal error: Failure creating: D3D12Viewport (WindowsD3D12Viewport.cpp:162)
; The failure is NOT GPU-specific and NOT an FSR problem: FSR initialises
; cleanly (LogFSR: Successfully initialized FSR Upscaling provider using
; version '4.1.2 *').  XeFG is Intel XeFG (libxell.dll 1.3.2) and is a
; secondary/vendor-specific path; the AMD-first doctrine says FSR owns
; upscaling and XeFG must not touch the swap chain.
;
; Fix = set the override off at project level (equivalent to the engine's
; -XeFGOverrideSwapChainDisabled switch, but baked into the shipped .exe so
; the crash cannot recur on any machine).  XeSS UPSCALING (XeSS 3) is a
; separate module and is unaffected - it still ships and still works.
; ---------------------------------------------------------------------------
r.XeFG.OverrideSwapChain=0

[/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
bEnablePlugin=True
bAllowNetworkConnection=True
SecurityToken=7FEAB2A9498F0AC994C2D387D9A874C7
bIncludeInShipping=False
bAllowExternalStartInShipping=False
bCompileAFSProject=False
bUseCompression=False
bLogFiles=False
bReportStats=False
ConnectionType=USBOnly
bUseManualIPAddress=False
ManualIPAddress=

; ---------------------------------------------------------------------------
; Shader Model 6 for D3D12.
; The engine ships D3D12 SM5-only (BaseEngine.ini:3411:
; +D3D12TargetedShaderFormats=PCD3D_SM5).  The FSR 3/4 compute path and the
; newer upscaler shaders are SM6.  The engine already defines the PCD3D_SM6
; shader platform (BaseEngine.ini:3973), so SM6 is targetable, and the Radeon
; driver now reports D3D12 12_2.  The '+' is additive: SM5 stays available.
; ---------------------------------------------------------------------------
[/Script/WindowsTargetPlatform.WindowsTargetSettings]
+D3D12TargetedShaderFormats=PCD3D_SM6
