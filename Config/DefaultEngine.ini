; The Commander - Engine configuration
; Design targets: 144+ FPS, raw mouse input, no regeneration, classic pickups.

[/Script/EngineSettings.GameMapsSettings]
; Boot straight into the gameplay map once it exists.
; GameDefaultMap=/Game/Maps/M_CommanderEntry.M_CommanderEntry
EditorStartupMap=
GameInstanceClass=/Script/Engine.GameInstance

[/Script/Engine.Engine]
; Raw mouse input - no OS acceleration smoothing.
bUseRawMouseInput=True
; Frame pacing: uncapped in-game; the design target is 144+.
SmoothedFrameRateRange=(LowerBound=(Type=Inclusive,Value=22.000000),UpperBound=(Type=Exclusive,Value=400.000000))

[/Script/Engine.RendererSettings]
; Performance-first raster pipeline for a retro shooter (no cinematic stack).
r.DefaultFeature.Projector=False
r.DefaultFeature.Bloom=False
r.DefaultFeature.AmbientOcclusion=False
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.Shadow.MaxCSMResolution=2048
r.AllowGlobalClipPlane=False
; Foreground FPS priority in windowed mode.
r.AllowMultipleGamesOfType=False

[/Script/Engine.InputSettings]
; Raw input for mouse; no smoothing on look.
bEnableMouseSmoothing=False
bViewAccelerationEnabled=False
bAlwaysShowTouchInterface=False
DefaultPlayerInputClass=/Script/Engine.PlayerInput
DefaultInputComponentClass=/Script/Engine.InputComponent

[ConsoleVariables]
; Cap solid pixel performance: stay raster, skip heavy deferred extras.
r.VSync=0

