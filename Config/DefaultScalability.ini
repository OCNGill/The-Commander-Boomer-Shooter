; The Commander - scalability groups
; ---------------------------------------------------------------------------
; The Steam Deck "low" preset lives in the [AntiAliasingQuality@0] and
; [PostProcessQuality@0] groups below (quality level 0 = LOW).
;
; Two engine rules shape what can go in here:
;
;  1. A scalability group can ONLY set cvars flagged ECVF_Scalability.
;     The engine rejects anything else with:
;       "Scalability.ini can only set ECVF_Scalability console variables
;        ('%s'='%s' is ignored)"
;     (UE::ConfigUtilities::OnSetCVarFromIniEntry). The FSR cvars
;     (r.FidelityFX.FSR.*) are ECVF_RenderThreadSafe only, so the FSR
;     provider selection lives in Config/DefaultDeviceProfiles.ini and the
;     [ConsoleVariables] block of DefaultEngine.ini, NOT here.
;
;  2. A scalability group is applied at ECVF_SetByScalability, the weakest
;     of the config priorities, so it never overrides a device profile
;     (ECVF_SetByDeviceProfile) or an explicit ini value.
;
; BLOOM: per the project doctrine, bloom is NOT a global feature. The
; project's DefaultEngine.ini keeps r.DefaultFeature.Bloom=False, so no
; level gets bloom by default. What these groups add is the per-level
; control: r.BloomQuality is ECVF_Scalability, so it can be raised for the
; levels that should pay for it and left at 0 for the Deck's LOW level.
; The enemy reveal is emissive-driven and is handled by a Post Process
; Volume in the level (see Docs/generated/PERFORMANCE_UPSCALER_PROFILE.md).
; ---------------------------------------------------------------------------

; ---------------------------------------------------------------------------
; Anti-aliasing quality 0 = LOW (the Steam Deck preset).
; ---------------------------------------------------------------------------
[AntiAliasingQuality@0]
r.FXAA.Quality=0
r.TemporalAA.Quality=0
; TSR history settings inherited from the engine base, kept for the case
; where FSR cannot initialise and the engine falls back to TSR.
r.TSR.History.R11G11B10=1
r.TSR.History.ScreenPercentage=100
r.TSR.History.UpdateQuality=0
r.TSR.ShadingRejection.Flickering=0
r.TSR.RejectionAntiAliasingQuality=0
r.TSR.ReprojectionField=0
r.TSR.Resurrection=0

; ---------------------------------------------------------------------------
; Post-process quality 0 = LOW (the Steam Deck preset).
; ---------------------------------------------------------------------------
[PostProcessQuality@0]
r.MotionBlurQuality=0
r.MotionBlur.HalfResGather=1
r.AmbientOcclusionMipLevelFactor=1.0
r.AmbientOcclusionMaxQuality=0
r.AmbientOcclusionLevels=0
r.AmbientOcclusionRadiusScale=1.2
r.DepthOfFieldQuality=0
r.RenderTargetPoolMin=300
r.LensFlareQuality=0
r.SceneColorFringeQuality=0
r.EyeAdaptationQuality=2
; BLOOM OFF at LOW. The Deck pays nothing for the bloom pass. The emissive
; reveal gets its glow from a Post Process Volume in the level, not from a
; global flag.
r.BloomQuality=0
r.Bloom.ScreenPercentage=25.000
r.FastBlurThreshold=0
r.Upscale.Quality=1
r.LightShaftQuality=0
r.Filter.SizeScale=0.6
r.LUT.Shaper=0
r.LUT.Size=32
r.Tonemapper.Quality=0

; ---------------------------------------------------------------------------
; Post-process quality 1 = MEDIUM. Bloom is available at this level for
; the reveal, at a modest cost.
; ---------------------------------------------------------------------------
[PostProcessQuality@1]
r.MotionBlurQuality=3
r.MotionBlur.HalfResGather=1
r.AmbientOcclusionMipLevelFactor=1.0
r.AmbientOcclusionMaxQuality=60
r.AmbientOcclusionLevels=-1
r.AmbientOcclusionRadiusScale=1.5
r.DepthOfFieldQuality=1
r.RenderTargetPoolMin=350
r.LensFlareQuality=0
r.SceneColorFringeQuality=0
r.EyeAdaptationQuality=2
; Bloom ON at MEDIUM and above. The reveal volume in the level supplies
; the intensity; this only decides whether the pass runs at all.
r.BloomQuality=4
r.Bloom.ScreenPercentage=35.355
r.FastBlurThreshold=2
r.Upscale.Quality=2
r.LightShaftQuality=0
r.Filter.SizeScale=0.7
r.LUT.Shaper=0
r.LUT.Size=32
r.Tonemapper.Quality=2
